apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: infrastructure
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.2
      helm:
        valueFiles:
          - $values/argocd/values.yaml
        valuesObject:
          global:
            networkPolicy:
              create: false
    - repoURL: https://github.com/byulmaru/infrastructure-old.git
      targetRevision: HEAD
      ref: values
      path: argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
